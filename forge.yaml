name: testenv-vm
artifactStorePath: .forge/artifact-store.yaml
envFile: .envrc

build:
  - name: gen-testenv-vm
    src: ./cmd/testenv-vm
    engine: forge://forge-dev

  - name: testenv-vm
    src: ./cmd/testenv-vm
    dest: ./build/bin
    engine: forge://go-build
    depends: [gen-testenv-vm]

  - name: testenv-vm-provider-stub
    src: ./cmd/providers/testenv-vm-provider-stub
    dest: ./build/bin
    engine: forge://go-build

  - name: testenv-vm-provider-libvirt
    src: ./cmd/providers/testenv-vm-provider-libvirt
    dest: ./build/bin
    engine: forge://go-build

test:
  - name: lint-tags
    runner: forge://go-lint-tags

  - name: lint-licenses
    runner: forge://go-lint-licenses

  - name: lint
    runner: forge://go-lint

  - name: unit
    runner: forge://go-test

  - name: integration
    runner: forge://go-test

  - name: e2e
    runner: forge://go-test

  - name: e2e_libvirt
    runner: forge://go-test

  - name: e2e_libvirt_delete
    runner: forge://go-test

factory:
  module: github.com/alexandremahdhaoui/testenv-vm
  goVersion: "1.26.5"
  manifest: committed

providers:
  - name: libvirt
    engine: ./build/bin/testenv-vm-provider-libvirt
    default: true
    spec: {}

images:
  - name: talos-metal-amd64
    spec:
      source: https://github.com/siderolabs/talos/releases/download/v1.14.0/metal-amd64.iso
      sha256: 630b8a0fd3461b83189c04c42c208aaeabdb30b2b701868e48704de69d620c86
  - name: openwrt-x86-64
    spec:
      source: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-24.10.8-x86-64-generic-ext4-combined.img.gz
      sha256: 23872c64fdb66d0765e0d17f71453a66e7a91e9ecb10606d5f738e6d166e14ae

networks:
  - name: e2e-boot-talos-net
    kind: nat
    provider: libvirt
    spec:
      cidr: "192.168.232.0/24"
  - name: e2e-boot-openwrt-lan
    kind: nat
    provider: libvirt
    spec:
      cidr: "192.168.1.0/24"
      gateway: "192.168.1.254"
      dhcp:
        enabled: false

vms:
  - name: e2e-boot-talos
    provider: libvirt
    spec:
      memory: 2048
      vcpus: 2
      network: e2e-boot-talos-net
      disk:
        size: 10G
      cdrom: "{{ .Images.talos-metal-amd64.Path }}"
      boot:
        order: [cdrom]
      readiness:
        tcp:
          port: 50000
          timeout: 5m
  - name: e2e-boot-openwrt
    provider: libvirt
    spec:
      memory: 512
      vcpus: 1
      network: e2e-boot-openwrt-lan
      disk:
        baseImage: "{{ .Images.openwrt-x86-64.Path }}"
        size: 1G
      boot:
        order: [hd]
      readiness:
        tcp:
          address: "192.168.1.1"
          port: 22
          timeout: 5m
